# page modülünü derler.
#
# NEDEN VAR: bu depoda hiç CI yoktu (`.github` dizini bile yoktu), yani bir
# senkronun derlendiğini gösteren tek kanıt, PR yazarının elle koşturduğu
# `page/compile` idi.
#
# Şimdi gerekli olmasının sebebi: `page/src/main/scala` ÜRETİLMİŞ bir kopya --
# kojojs-dev'den `sync-kojojs-core.sh` ile geliyor ve o betiğin kilidi
# kaldırıldı (kojojs-dev#120), yani senkron rutin bir işe dönüyor. Kilidin
# eskiden koruduğu şey tam olarak "senkron core build'ini kırar" idi; kilit
# gidince o korumanın yerini alacak şey bu iş.
#
# Kovaladığı hata sınıfı somut: kojojs-core#26 öncesinde canlı sitedeki
# /yardim/komutlar sayfası `soluk` ve `döndürMerkezli` gösterilerini
# gösteriyordu ama derleyici tarafında o API yoktu -- öğrenci tıklayınca
# derleme hatası alıyordu ve hiçbir şey kırmızı yanmıyordu.
#
# KAPSAMI DAR, BİLEREK: yalnız `page` derleniyor. `compiler-server` ve
# `client` modülleri ağır (akka, scalatags, tam Scala.js bağlama) ve bu depoda
# senkronla değişmiyorlar. Derleme denetimi tek sınama takımı olmayan bir
# depoda bile "kaynak kendi içinde tutarlı mı" sorusuna ucuz bir cevap; sınama
# takımının yerine geçmiyor (davranış savları kojojs-dev'de koşuyor).
name: derleme

# push yalnız master'da: dalları zaten pull_request tetikliyor, ikisi birden
# açıkken her PR itmesi işi iki kez koşturuyor (kardeş kojojs-dev deposunda
# ölçülmüş bir davranış).
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  page-derleme:
    name: page modülü derleniyor mu
    runs-on: ubuntu-latest
    # Soğuk koşuda bağımlılık indirmesi derlemeden uzun sürüyor; asılı kalan
    # bir çözümlemeyi runner'ın 6 saatlik varsayılanına kadar beklemeyelim.
    timeout-minutes: 30
    env:
      # Kaynakta Türkçe adlı tanımlar var (res$AydınlıkBD gibi .class adları);
      # UTF-8 olmadan zinc InvalidPathException ile çöküyor. Kozmetik değil.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      # Action'lar MAJOR etiketine sabitleniyor (SHA'ya değil), kardeş
      # kojojs-dev deposuyla aynı politika: güvenlik yamaları kendiliğinden
      # gelsin, kırıcı değişiklik major atlarken bilinçli olsun.
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # 21: kojojs-dev ve kojo depolarının ölçülmüş seçimi; depolar arası
          # tek sürümde durmak için aynısı.
          java-version: "21"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: page/compile
        run: sbt -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8 page/compile

  # kojojs-dev#183 Aşama 2: Koco <-> Kojo çevirmeni (POST /cevir). router/ içindeki
  # çevirmen kopyası bulent2k2/kojo'nun SABİT bir commit'inden (router/CEVIRMEN_SURUMU);
  # bu iş kopyanın hâlâ bayt bayt o commit olduğunu ve router'ın derlenip sınandığını
  # denetler. page-derleme'den ayrı iş: router ağır (akka) ve page senkronuyla değişmiyor.
  router:
    name: router derleniyor ve çevirmen kopyası aynı mı
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v7

      - name: çevirmen sürümü
        id: surum
        run: |
          sha="$(grep -v '^#' router/CEVIRMEN_SURUMU | grep -m1 -E '^[0-9a-f]{40}$' || true)"
          [ -n "$sha" ] || { echo "::error::router/CEVIRMEN_SURUMU'nda 40 haneli bir SHA yok."; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: bulent2k2/kojo
          ref: ${{ steps.surum.outputs.sha }}
          path: kojo-kaynak

      - name: çevirmen kopyası sabit commit'le aynı mı
        run: router/cevirmen-esitle.sh --kojo kojo-kaynak --denetle

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: router/test
        run: sbt -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8 router/test

      # Birim sınaması bunu YAKALAMAZ: scalatest scala-xml'i Test sınıf yoluna getiriyor,
      # üretim yolunda eksik olsa da sınama geçiyor (canlı sunucuda NoClassDefFoundError
      # olarak ölçüldü; router/CEVIRMEN.md). Bu yüzden üretim sınıf yoluna ayrıca bakılıyor.
      - name: üretim sınıf yolunda scala-xml var mı
        run: |
          # sbt'nin ÇIKTISININ SON SATIRI sınıf yolu diye varsayılmıyor: koşucuda ilk deneme "scala-xml
          # yok" dedi, oysa yerelde var -- sbt betiği sonuna başka bir şey yazıyor olabilir. Sınıf yolu,
          # router/lib/scalariform.jar'ı içeren satır; o satır bulunamazsa da hata, günlükte çıktı duruyor.
          sbt -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8 --error "export router/Runtime/fullClasspath" > /tmp/sbt-cikti.txt 2>&1 || true
          echo "--- sbt çıktısı (satır sayısı: $(wc -l < /tmp/sbt-cikti.txt))"; cut -c1-200 /tmp/sbt-cikti.txt | tail -20
          grep -F 'router/lib/scalariform.jar' /tmp/sbt-cikti.txt | tail -1 | tr ':' '\n' > /tmp/router-cp.txt
          [ -s /tmp/router-cp.txt ] || { echo "::error::sınıf yolu satırı bulunamadı (router/lib/scalariform.jar içeren satır yok)."; exit 1; }
          grep -q 'scala-xml_2.13' /tmp/router-cp.txt || { echo "::error::router üretim sınıf yolunda scala-xml yok; /cevir ilk istekte NoClassDefFoundError verir."; exit 1; }
          ! grep -q 'scalatest' /tmp/router-cp.txt || { echo "::error::scalatest üretim sınıf yoluna sızmış."; exit 1; }
